<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Dynamic Product Dashboard</title>
</head>

<body>

  <main class="dashboard">

    <header class="header">
      <div>
        <h1>Product Dashboard</h1>
        <p>Live products from REST API</p>
      </div>

      <div>
        🛒 Cart: <strong id="cart-count">0</strong>
      </div>
    </header>

    <section class="controls">

      <input
        type="search"
        id="search-input"
        placeholder="🔍 Search products..."
      >

      <div class="categories">
        <button class="category-btn active" data-category="all">
          All
        </button>

        <button class="category-btn" data-category="electronics">
          Electronics
        </button>

        <button class="category-btn" data-category="jewelery">
          Jewelry
        </button>

        <button class="category-btn" data-category="men's clothing">
          Men's
        </button>

        <button class="category-btn" data-category="women's clothing">
          Women's
        </button>
      </div>

      <select id="sort-select">
        <option value="default">Sort Products</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
        <option value="name">Name: A to Z</option>
      </select>

    </section>

    <section class="dashboard-grid">
      <article class="card">
        <h2>Loading...</h2>
        <p>Fetching products...</p>
      </article>
    </section>

  </main>

  <script src="api.js"></script>
  <script src="app.js"></script>

</body>
</html>
